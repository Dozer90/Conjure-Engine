# Nightly matrix (docs/design/08_testing.md 7.3, D11, D13, D15, D16;
# docs/handbook/development/continuous-integration.md): the two build legs with the slow and scripting-hot-reload
# cases, the Distribution unit suite and export round trip, the golden images on the D3D12 WARP software rasteriser
# and the benchmarks at the ci machine class.
# Nothing here gates a pull request; a red nightly is a ticket for the module owner.
#
# Every job runs on the owner's self-hosted Windows runner (labels self-hosted, Windows, X64): GitHub-hosted
# runners are not available to this account. The Linux legs and jobs (linux-gcc-debug, linux-clang-sanitize,
# linux-gcc-dist, linux-clang-tsan, golden-vulkan-lavapipe, the Linux benchmarks) and the macOS leg (macos-debug)
# were removed until a runner of that OS exists; they are restored from git history (the commit that removed them)
# with runs-on [self-hosted, Linux, X64] or its macOS equivalent. A job reuses no build state from an earlier one:
# checkout cleans the workspace. No step uses bash: on this runner it is the WSL launcher.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Nothing here writes to the repository: the benchmark results leave as artefacts and step summaries.
permissions:
  contents: read

env:
  # Nightly allows no label-based skips: the golden jobs enable the images, the others never register them.
  # Skips by case-name tag follow the same per-leg policy as ci.yml (skip-tags): [window] and [audio_device]
  # everywhere, [gpu] nowhere (every job runs on Windows, where a [gpu] skip means the D3D12 WARP adapter is
  # missing); the downloaded cases must run in full-matrix-nightly.
  # distribution-export fetches no downloaded assets, so its unit suite may skip [downloaded] as well.
  CONJURE_TEST_ALLOWED_SKIPS: ""

jobs:
  full-matrix-nightly:
    name: nightly-${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-debug
            preset: windows-msvc-debug
            test-preset: windows-msvc-debug-nightly
            skip-tags: --allow-tag window --allow-tag audio_device
          - name: windows-msvc-dev
            preset: windows-msvc-dev
            test-preset: ""
            skip-tags: --allow-tag window --allow-tag audio_device
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Cache dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('third_party/CMakeLists.txt', 'third_party/*.cmake') }}
      - name: Download test assets
        run: python tools/download_test_assets.py --locked
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      # The *-nightly test presets exclude only the benchmark label (slow, process and downloaded cases run);
      # legs without one run the same filter through --test-dir.
      - name: Test (nightly preset)
        if: matrix.test-preset != ''
        run: ctest --preset ${{ matrix.test-preset }} --output-junit junit.xml
      - name: Test (benchmark label excluded)
        if: matrix.test-preset == ''
        run: >
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure -j 4 -LE benchmark
          --output-junit junit.xml
      - name: Check skips
        run: >
          python tools/ctest_check_skips.py --build-dir build/${{ matrix.preset }}
          --junit build/${{ matrix.preset }}/junit.xml ${{ matrix.skip-tags }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-reports-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/junit.xml
            build/${{ matrix.preset }}/test_output
          if-no-files-found: ignore

  distribution-export:
    name: distribution-export-${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            dist-preset: windows-msvc-dist
            dev-preset: windows-msvc-dev
            skip-tags: --allow-tag window --allow-tag audio_device --allow-tag downloaded
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      # The Distribution runtime and the Development editor that exports with it (the editor is never part of
      # a Distribution build, 04_editor.md 8).
      - name: Configure and build Distribution
        id: build-dist
        shell: cmd
        run: |
          cmake --preset ${{ matrix.dist-preset }} || exit /b 1
          cmake --build --preset ${{ matrix.dist-preset }} --parallel || exit /b 1
      - name: Configure and build Development
        id: build-dev
        shell: cmd
        run: |
          cmake --preset ${{ matrix.dev-preset }} || exit /b 1
          cmake --build --preset ${{ matrix.dev-preset }} --parallel ^
            --target conjure_editor conjure_runtime || exit /b 1
      # The process cases and the two checks of the Distribution binaries that tests/runtime/CMakeLists.txt registers
      # in a Distribution tree when the configure found Python 3 (setup-python above provides it), both label process:
      # runtime.distribution_symbols (no editor symbol in conjure_runtime or conjure_shared) and
      # runtime.distribution_paths (follow-up FU-NIGHTLY: neither the source nor the build directory of the tree, nor
      # Conjure's own checkout when it is a subproject, may appear in either binary, in a string, debug information or
      # a PDB reference; code sweep F613, cmake/ConjureDistributionPaths.cmake). Runs whenever the Distribution build
      # succeeded, so a red Development build does not hide it. --no-tests=error would not notice the two checks
      # missing while other process cases match, so the step first requires both entries to be registered. Every case
      # here may exit 77 (skipped), which ctest counts as a pass, so the run writes junit_dist_process.xml for the
      # skip check below.
      - name: Distribution symbol and path checks and process tests
        id: process-tests
        if: ${{ !cancelled() && steps.build-dist.outcome == 'success' }}
        shell: powershell
        run: |
          $listed = ctest --test-dir build/${{ matrix.dist-preset }} -N -R '^runtime\.distribution_(paths|symbols)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($listed -match 'Total Tests: 2\s*$')) {
            $listed | Write-Output
            Write-Output "::error::runtime.distribution_symbols and runtime.distribution_paths are not both registered"
            exit 1
          }
          ctest --test-dir build/${{ matrix.dist-preset }} --output-on-failure -L "process|runtime" --no-tests=error `
            --output-junit junit_dist_process.xml
          exit $LASTEXITCODE
      # Export tests/assets/projects/scripted (samples/feature_test once wave 5 lands it) with the Development
      # editor and --distribution, the export path a user takes: step 5 copies the Distribution runtime,
      # conjure_shared, nethost.dll when present, the Visual C++ runtime DLLs (06_engine_loop.md D14), the
      # licence notices (D15) and shaders/ (engine/src/engine/export_pipeline.cpp), and step 3 publishes
      # Conjure.Bootstrap from this checkout and builds the project's scripts/Game.csproj into managed/ (follow-up
      # FU-PDB). The project is copied below RUNNER_TEMP, outside the checkout's git repository: source control gives
      # it no source root, so the export's source roots file has to map its paths. The step checks that the notices,
      # vcruntime140.dll and the three assemblies arrived, then runs that runtime headless with scripting for 300
      # frames (08_testing.md 7.3 nightly table), requires the log line the project's ExportProbe script writes when
      # it is created, and checks the runtime's exported symbols. Nobody on the runner answered for the copied
      # project, so the export needs --trust-project or it exits with 2 (PROJECT_NOT_TRUSTED, 04_editor.md D27). It
      # needs both builds and nothing else, so a red symbol or path check in the step before does not hide it.
      - name: Export and run
        id: export
        if: ${{ !cancelled() && steps.build-dist.outcome == 'success' && steps.build-dev.outcome == 'success' }}
        shell: powershell
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'export_project'
          if (Test-Path -LiteralPath $project) { Remove-Item -LiteralPath $project -Recurse -Force }
          Copy-Item -Recurse tests/assets/projects/scripted $project
          build/${{ matrix.dev-preset }}/bin/conjure_editor.exe --headless --project $project `
            --trust-project --export build/export_out --distribution build/${{ matrix.dist-preset }}/bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shipped = @('THIRD_PARTY_NOTICES.txt', 'vcruntime140.dll', 'managed/Conjure.Bootstrap.dll',
            'managed/Conjure.Managed.dll', 'managed/Game.dll')
          foreach ($file in $shipped) {
            if (-not (Test-Path -LiteralPath "build/export_out/$file" -PathType Leaf)) {
              Write-Output "::error::the export has no $file"
              exit 1
            }
          }
          # The Distribution runtime is a Windows GUI program, which PowerShell starts without waiting for it: the
          # pipe makes it wait, so the exit code and the log are the finished run's.
          build/export_out/conjure_runtime.exe --project build/export_out --headless --scripting --frames 300 `
            --log-level info --log-file build/export_runtime.log | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath build/export_runtime.log -SimpleMatch -Quiet `
              'ExportProbe ran in the exported game')) {
            Get-Content -LiteralPath build/export_runtime.log | Write-Output
            Write-Output "::error::the exported runtime did not run the project's ExportProbe script"
            exit 1
          }
          python tools/check_distribution_symbols.py --binary build/export_out/conjure_runtime.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The managed assemblies of the export (follow-up FU-PDB): neither the checkout nor the exported project, which
      # lies outside git below RUNNER_TEMP, may appear in Conjure.Managed.dll, Conjure.Bootstrap.dll, the game's
      # scripts or their .pdb files, in the CodeView PDB path, a string or a document of a portable PDB
      # (tools/check_distribution_paths.py reads all three; it always checks the checkout, --root adds the project).
      # The export step required the assemblies, so a missing managed directory here is an error.
      - name: Managed path check
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        shell: powershell
        run: |
          $managed = 'build/export_out/managed'
          if (-not (Test-Path -LiteralPath $managed -PathType Container)) {
            Write-Output "::error::the export published no managed code (no $managed)"
            exit 1
          }
          $arguments = @()
          foreach ($file in Get-ChildItem -LiteralPath $managed -File) {
            if ($file.Extension -in '.dll', '.pdb') {
              $arguments += '--binary'
              $arguments += $file.FullName
            }
          }
          if ($arguments.Count -eq 0) {
            Write-Output "::error::$managed holds no assembly"
            exit 1
          }
          python tools/check_distribution_paths.py --root (Join-Path $env:RUNNER_TEMP 'export_project') @arguments
          exit $LASTEXITCODE
      # The whole unit suite in the shipping configuration (08_testing.md D16, code sweep F332): asserts and
      # TRACE/DEBUG logging are compiled out here and in no other job, so code that leans on an assert's side
      # effect fails only in this run. The test executables are part of the Distribution build above; the preset
      # applies the pull-request label filter (benchmark, golden, downloaded, slow and process excluded, the
      # process cases ran in the step before the export). The step comes last and depends on the Distribution
      # build alone, so a red unit suite never hides the export round trip and a red export never hides the suite.
      - name: Distribution unit tests
        id: dist-tests
        if: ${{ !cancelled() && steps.build-dist.outcome == 'success' }}
        run: ctest --preset ${{ matrix.dist-preset }} --output-junit junit_dist.xml
      # Runs whenever the suite step or the process step ran, green or red: ctest writes its report also when cases
      # fail, so a red night reports its unexpected skips in the same run instead of hiding them until the failures
      # are fixed. A report is checked when its step ran and wrote it; a red process step that stopped at the
      # registration check wrote none and is red already, but a green step without its report is an error.
      - name: Check skips
        if: >-
          ${{ !cancelled() && (steps.dist-tests.outcome == 'success' || steps.dist-tests.outcome == 'failure'
          || steps.process-tests.outcome == 'success' || steps.process-tests.outcome == 'failure') }}
        shell: powershell
        run: |
          $reports = @()
          $runs = @(
            @{ Outcome = '${{ steps.dist-tests.outcome }}'; Report = 'junit_dist.xml' },
            @{ Outcome = '${{ steps.process-tests.outcome }}'; Report = 'junit_dist_process.xml' }
          )
          foreach ($run in $runs) {
            $path = "build/${{ matrix.dist-preset }}/$($run.Report)"
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              $reports += '--junit'
              $reports += $path
            } elseif ($run.Outcome -eq 'success') {
              Write-Output "::error::the step that writes $path succeeded without writing it"
              exit 1
            }
          }
          if ($reports.Count -eq 0) {
            Write-Output "::error::neither ctest run wrote a JUnit report"
            exit 1
          }
          python tools/ctest_check_skips.py --build-dir build/${{ matrix.dist-preset }} @reports ${{ matrix.skip-tags }}
          exit $LASTEXITCODE
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-reports-${{ matrix.name }}
          path: |
            build/${{ matrix.dist-preset }}/junit_dist.xml
            build/${{ matrix.dist-preset }}/junit_dist_process.xml
            build/${{ matrix.dist-preset }}/test_output
          if-no-files-found: ignore

  golden-d3d12-warp:
    name: golden-d3d12-warp
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-msvc-dev -DCONJURE_TEST_GOLDEN_IMAGES=ON
      - name: Build
        run: cmake --build --preset windows-msvc-dev --parallel
      # --no-tests=error: until tests/golden registers its cases (09_cross_area_resolutions.md 4 item 15) this
      # step fails with "No tests were found" instead of passing with zero image comparisons.
      - name: Golden images
        run: ctest --test-dir build/windows-msvc-dev --output-on-failure -L golden --no-tests=error
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-d3d12-warp
          path: build/windows-msvc-dev/test_output
          if-no-files-found: ignore

  benchmarks-ci-class:
    name: benchmarks-${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            preset: windows-msvc-dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel --target conjure_benchmarks
      # The ci machine class is 3x desktop; a breach or a missing threshold fails the job (08_testing.md D10).
      # The runner exits 77 only when every scenario skipped, and every skip() is an unmet precondition, so a
      # single SKIPPED row fails the job too (D12). The report is written to the step summary before either
      # check fails the step, so it is still published. The report file is written as UTF-8 without a byte order
      # mark (Tee-Object -FilePath in Windows PowerShell 5.1 would write UTF-16).
      - name: Benchmarks
        shell: powershell
        run: |
          $report = Join-Path (Get-Location).Path 'build/bench-${{ matrix.name }}.txt'
          build/${{ matrix.preset }}/bin/conjure_benchmarks.exe --class ci --enforce `
            --out build/bench-${{ matrix.name }}.json | Tee-Object -Variable lines
          $benchmarkExit = $LASTEXITCODE
          $lines = [string[]]@($lines)
          [System.IO.File]::WriteAllLines($report, $lines)
          $summary = [string[]](@('### Benchmarks (${{ matrix.name }}, class ci)', '```') + $lines + @('```'))
          [System.IO.File]::AppendAllLines($env:GITHUB_STEP_SUMMARY, $summary)
          $skipped = @($lines | Select-String -SimpleMatch 'status=SKIPPED')
          if ($skipped.Count -gt 0) {
            Write-Output '::error::a benchmark scenario was SKIPPED (08_testing.md D12: skipped means not measured)'
            $skipped | ForEach-Object { $_.Line }
            exit 1
          }
          exit $benchmarkExit
      # Also after a breach or a SKIPPED row: those are the runs whose JSON report needs inspecting.
      - name: Upload results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ matrix.name }}
          path: |
            build/bench-${{ matrix.name }}.json
            build/bench-${{ matrix.name }}.txt
          if-no-files-found: ignore
