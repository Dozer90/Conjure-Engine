# Pull-request matrix (docs/design/08_testing.md 7.3 and D15, docs/handbook/ci.md): five build-and-test legs
# with the presets developers use locally plus the style-and-headers job. Expensive and noisy checks (TSan,
# golden images, benchmarks, the Distribution export) run in nightly.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: checkout, the caches and the artefact uploads need read access only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes the running check; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Skips of these labels are expected on pull requests (golden images are nightly only). Skips by case-name
  # tag are allowed per leg through skip-tags below (08_testing.md D12): [window] and [downloaded] everywhere,
  # [audio_device] everywhere (the runners have no playback endpoint), [gpu] where the D3D12 WARP adapter does
  # not exist (Linux, macOS); on Windows a [gpu] skip means WARP is missing and fails the leg.
  CONJURE_TEST_ALLOWED_SKIPS: golden

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-debug
            os: windows-latest
            preset: windows-msvc-debug
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device
          - name: windows-msvc-dev
            os: windows-latest
            preset: windows-msvc-dev
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device
            export-smoke: true
          - name: linux-gcc-debug
            os: ubuntu-24.04
            preset: linux-gcc-debug
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device --allow-tag gpu
          - name: linux-clang-sanitize
            os: ubuntu-24.04
            preset: linux-clang-sanitize
            # D13: CoreCLR is not sanitizer-clean; scripting is covered by the other legs.
            configure-args: -DCONJURE_WITH_SCRIPTING=OFF
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device --allow-tag gpu
          - name: macos-debug
            os: macos-14
            preset: macos-debug
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device --allow-tag gpu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libvulkan-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Cache dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('third_party/CMakeLists.txt', 'third_party/*.cmake') }}

      - name: Cache downloaded test assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/.downloaded
            tests/.assets_ready
          key: test-assets-${{ hashFiles('tools/test_assets.json') }}

      - name: Download test assets
        run: python tools/download_test_assets.py

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure-args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }} --output-junit junit.xml

      # --no-tests=error: a label run that matches nothing is a broken registration, not a pass. The report of this
      # run goes through the skip check as well, so a [process] or [downloaded] case that exits 77 is examined.
      - name: Downloaded-asset and process tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: >
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure -L "downloaded|process"
          --no-tests=error --output-junit junit_labels.xml

      - name: Check skips
        run: >
          python tools/ctest_check_skips.py --build-dir build/${{ matrix.preset }}
          --junit build/${{ matrix.preset }}/junit.xml --junit build/${{ matrix.preset }}/junit_labels.xml
          ${{ matrix.skip-tags }}

      # The Development leg exports a project with the editor and boots the result with the runtime for 120
      # frames (ARCHITECTURE.md 11 "Wave 4 exit"). tests/assets/projects/minimal stands in for
      # samples/feature_test until wave 5 lands the sample; the project is copied first because the asset
      # database writes .meta sidecars and its cache next to the sources. Nobody on the runner answered for the
      # copy, so the export needs --trust-project or it exits with 2 (PROJECT_NOT_TRUSTED, 04_editor.md D27); the
      # runtime has no trust question.
      - name: Export smoke
        if: matrix.export-smoke
        shell: pwsh
        run: |
          Copy-Item -Recurse tests/assets/projects/minimal build/export_smoke_project
          build/${{ matrix.preset }}/bin/conjure_editor.exe --headless --project build/export_smoke_project `
            --trust-project --export build/export_smoke_out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/${{ matrix.preset }}/bin/conjure_runtime.exe --project build/export_smoke_out --headless --frames 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/junit.xml
            build/${{ matrix.preset }}/junit_labels.xml
            build/${{ matrix.preset }}/test_output
          if-no-files-found: ignore

  style-and-headers:
    name: style-and-headers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The id gives the "dotnet format" step the SDK version this step installs (its dotnet-version output).
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        id: dotnet
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libvulkan-dev

      - name: Style
        run: python tools/check_style.py --tests-mirror-headers

      # Distribution binaries must not name the checkout that built them (code sweep F613). The check itself needs
      # a Distribution build and runs in nightly.yml; its tests run here on every change, with the probe of the
      # compile options (cmake/ConjureDistributionPathsProbe.cmake, through the runner image's cmake).
      - name: Distribution path check tests
        run: python -I tools/tests/test_check_distribution_paths.py

      - name: Export annotations
        run: |
          python tools/check_exports.py
          python tools/check_exports.py --self-test

      - name: Tool self-tests
        run: |
          python tools/check_distribution_symbols.py --self-test
          python tools/ctest_check_skips.py --self-test

      - name: Documentation
        run: |
          python tools/check_docs.py
          python tools/tests/test_check_docs.py
          python -m pip install -r tools/docs_requirements.txt
          python -m mkdocs build --strict

      - name: Cache dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/linux-gcc-debug/_deps
          key: deps-style-and-headers-${{ hashFiles('third_party/CMakeLists.txt', 'third_party/*.cmake') }}

      - name: Header check
        run: |
          cmake --preset linux-gcc-debug
          cmake --build --preset linux-gcc-debug --parallel --target conjure_header_check

      # The C# layout gate (08_testing.md D17, code sweep F784): the formatter reads the rules from .editorconfig
      # and a difference in any of the three managed projects fails the job. C++ has no formatter step:
      # tools/check_style.py above is its only style gate, because .clang-format cannot express
      # docs/CODE_STYLE.cpp (the two-space continuation indent) and stays an optional local aid.
      #
      # Which formatter judges: with no global.json, dotnet runs the newest SDK on the runner, and the image
      # carries newer ones than the SDK setup-dotnet adds. So the step writes a global.json that names exactly
      # the version setup-dotnet installed (roll-forward disabled: that SDK or an error) and prints the version
      # in use. A global.json that is already there is left alone and decides instead: once the repository
      # tracks one (decided in code sweep F778), this step needs no change, provided the setup-dotnet step
      # installs an SDK that file accepts; dotnet fails here when none is installed.
      #
      # The step is the last of the job and runs after a failed step too, so a C# difference cannot hide the
      # header check or the other way round; the loop lets all three projects report before the step fails.
      - name: dotnet format
        if: ${{ !cancelled() }}
        env:
          SETUP_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if [ ! -f global.json ]; then
            if ! printf '%s' "$SETUP_DOTNET_SDK" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$'; then
              echo "::error::setup-dotnet reported no SDK version ('$SETUP_DOTNET_SDK'): the formatter is unknown"
              exit 1
            fi
            printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' "$SETUP_DOTNET_SDK" > global.json
          fi
          cat global.json
          dotnet --version
          status=0
          for project in Conjure.Managed Conjure.Bootstrap Conjure.TestScripts; do
            dotnet format --verify-no-changes "managed/$project/$project.csproj" || status=1
          done
          exit $status
