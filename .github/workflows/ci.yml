# Pull-request matrix (docs/design/08_testing.md 7.3 and D15, docs/handbook/development/continuous-integration.md):
# two build-and-test legs with the presets developers use locally plus the style-and-headers job. Expensive and
# noisy checks (golden images, benchmarks, the Distribution export) run in nightly.yml.
#
# Every job runs on the owner's self-hosted Windows runner (labels self-hosted, Windows, X64): GitHub-hosted
# runners are not available to this account. The Linux legs (linux-gcc-debug, linux-clang-sanitize) and the macOS
# leg (macos-debug) were removed until a runner of that OS exists; they are restored from git history (the commit
# that removed them) with runs-on [self-hosted, Linux, X64] or its macOS equivalent. A job reuses no build state
# from an earlier one: checkout cleans the workspace. One runner runs the jobs one after another, each from a clean
# checkout, hence the 120-minute timeouts. No step uses bash: on this runner it is the WSL launcher.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: checkout, the caches and the artefact uploads need read access only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request supersedes the running check; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Skips of these labels are expected on pull requests (golden images are nightly only). Skips by case-name
  # tag are allowed per leg through skip-tags below (08_testing.md D12): [window] and [downloaded] everywhere,
  # [audio_device] everywhere (the runner may run as a Windows service, where a playback endpoint is not
  # guaranteed). [gpu] is allowed nowhere: every leg runs on Windows, where a [gpu] skip means the D3D12 WARP
  # adapter is missing and fails the leg.
  CONJURE_TEST_ALLOWED_SKIPS: golden

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-debug
            preset: windows-msvc-debug
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device
          - name: windows-msvc-dev
            preset: windows-msvc-dev
            skip-tags: --allow-tag window --allow-tag downloaded --allow-tag audio_device
            export-smoke: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Cache dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('third_party/CMakeLists.txt', 'third_party/*.cmake') }}

      - name: Cache downloaded test assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            tests/.downloaded
            tests/.assets_ready
          key: test-assets-${{ hashFiles('tools/test_assets.json') }}

      - name: Download test assets
        run: python tools/download_test_assets.py

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-junit junit.xml

      # --no-tests=error: a label run that matches nothing is a broken registration, not a pass. The report of this
      # run goes through the skip check as well, so a [process] or [downloaded] case that exits 77 is examined.
      - name: Downloaded-asset and process tests
        run: >
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure -L "downloaded|process"
          --no-tests=error --output-junit junit_labels.xml

      - name: Check skips
        run: >
          python tools/ctest_check_skips.py --build-dir build/${{ matrix.preset }}
          --junit build/${{ matrix.preset }}/junit.xml --junit build/${{ matrix.preset }}/junit_labels.xml
          ${{ matrix.skip-tags }}

      # The Development leg exports a project with the editor and boots the result with the runtime for 120
      # frames (ARCHITECTURE.md 11 "Wave 4 exit"). tests/assets/projects/minimal stands in for
      # samples/feature_test until wave 5 lands the sample; the project is copied first because the asset
      # database writes .meta sidecars and its cache next to the sources. Nobody on the runner answered for the
      # copy, so the export needs --trust-project or it exits with 2 (PROJECT_NOT_TRUSTED, 04_editor.md D27); the
      # runtime has no trust question.
      - name: Export smoke
        if: matrix.export-smoke
        shell: powershell
        run: |
          Copy-Item -Recurse tests/assets/projects/minimal build/export_smoke_project
          build/${{ matrix.preset }}/bin/conjure_editor.exe --headless --project build/export_smoke_project `
            --trust-project --export build/export_smoke_out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/${{ matrix.preset }}/bin/conjure_runtime.exe --project build/export_smoke_out --headless --frames 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/junit.xml
            build/${{ matrix.preset }}/junit_labels.xml
            build/${{ matrix.preset }}/test_output
          if-no-files-found: ignore

  style-and-headers:
    name: style-and-headers
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # First, because the Visual Studio environment it sets up carries the cmake and ctest of this runner: the
      # Distribution path check tests, the ctest_check_skips.py self-test and the header check below call them.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Style
        run: python tools/check_style.py --tests-mirror-headers

      # Distribution binaries must not name the checkout that built them (code sweep F613). The check itself needs
      # a Distribution build and runs in nightly.yml; its tests run here on every change, with the probe of the
      # compile options (cmake/ConjureDistributionPathsProbe.cmake, through the cmake that Set up MSVC provides).
      - name: Distribution path check tests
        run: python -I tools/tests/test_check_distribution_paths.py

      - name: Export annotations
        shell: cmd
        run: |
          python tools/check_exports.py || exit /b 1
          python tools/check_exports.py --self-test || exit /b 1

      - name: Tool self-tests
        shell: cmd
        run: |
          python tools/check_distribution_symbols.py --self-test || exit /b 1
          python tools/ctest_check_skips.py --self-test || exit /b 1

      - name: Documentation
        shell: cmd
        run: |
          python tools/check_docs.py || exit /b 1
          python tools/tests/test_check_docs.py || exit /b 1
          python tools/tests/test_docs.py || exit /b 1
          python tools/tests/test_regenerate_docs.py || exit /b 1
          python tools/tests/test_docs_policy.py || exit /b 1
          python tools/tests/test_docs_cpp.py || exit /b 1
          python tools/tests/test_docs_engineering.py || exit /b 1
          python tools/tests/test_docs_redirects.py || exit /b 1
          python tools/tests/test_docs_components.py || exit /b 1
          python tools/regenerate_docs.py --check || exit /b 1
          python -m pip install -r tools/docs_requirements.txt || exit /b 1
          python tools/tests/test_docs_site.py || exit /b 1
          python -m mkdocs build --strict || exit /b 1

      - name: Cache dependency sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/windows-msvc-debug/_deps
          key: deps-style-and-headers-${{ hashFiles('third_party/CMakeLists.txt', 'third_party/*.cmake') }}

      - name: Header check
        shell: cmd
        run: |
          cmake --preset windows-msvc-debug || exit /b 1
          cmake --build --preset windows-msvc-debug --parallel --target conjure_header_check || exit /b 1

      # The C# layout gate (08_testing.md D17, code sweep F784): the formatter reads the rules from .editorconfig
      # and a difference in any of the three managed projects fails the job. C++ has no formatter step:
      # tools/check_style.py above is its only style gate, because .clang-format cannot express
      # docs/CODE_STYLE.cpp (the two-space continuation indent) and stays an optional local aid.
      #
      # Which formatter judges: the repository's global.json (code sweep F778: SDK 10.0.100, rollForward
      # latestFeature) selects it, the newest installed 10.0 SDK, which is the one the setup-dotnet step installs
      # (10.0.x, the newest release). The step prints global.json and the SDK version in use.
      #
      # The step is the last of the job and runs after a failed step too, so a C# difference cannot hide the
      # header check or the other way round; the loop lets all three projects report before the step fails.
      - name: dotnet format
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Get-Content -LiteralPath global.json
          dotnet --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = 0
          foreach ($project in 'Conjure.Managed', 'Conjure.Bootstrap', 'Conjure.TestScripts') {
            dotnet format --verify-no-changes "managed/$project/$project.csproj"
            if ($LASTEXITCODE -ne 0) { $status = 1 }
          }
          exit $status
