name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-debug
            os: windows-latest
            preset: windows-msvc-debug
          - name: windows-msvc-dev
            os: windows-latest
            preset: windows-msvc-dev
          - name: linux-gcc-debug
            os: ubuntu-24.04
            preset: linux-gcc-debug
          - name: linux-clang-sanitize
            os: ubuntu-24.04
            preset: linux-clang-sanitize
          - name: macos-debug
            os: macos-14
            preset: macos-debug
          - name: windows-msvc-dist
            os: windows-latest
            preset: windows-msvc-dist
            build-only: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('third_party/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        if: ${{ !matrix.build-only }}
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}
