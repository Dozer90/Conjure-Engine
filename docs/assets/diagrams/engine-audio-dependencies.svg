<rect x="320" y="406" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-engine)"/>
<text x="432" y="440" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">engine</text>
</a>
<circle data-port="assets" data-access="public" cx="252" cy="110" r="4" fill="#8c8c8c"/>
<circle data-port="audio" data-access="private" cx="296" cy="286" r="4" fill="#8c8c8c"/>
<circle data-port="core" data-access="public" cx="252" cy="186" r="4" fill="#8c8c8c"/>
<circle data-port="thirdparty::miniaudio" data-access="private" cx="324" cy="186" r="4" fill="#8c8c8c"/>
</svg>
