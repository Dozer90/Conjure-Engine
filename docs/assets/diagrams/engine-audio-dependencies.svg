<text x="144" y="96" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">assets</text>
</a>
<a href="../../handbook/engine/core.html" target="_top">
<rect x="32" y="138" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-core)"/>
<text x="144" y="172" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">core</text>
</a>
<rect x="320" y="138" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-thirdparty::miniaudio)"/>
<text x="432" y="172" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">miniaudio</text>
