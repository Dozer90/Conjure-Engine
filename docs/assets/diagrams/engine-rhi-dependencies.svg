<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 438" role="img"
 aria-labelledby="graph-title graph-description">
<title id="graph-title">Rhi module dependencies</title>
<desc id="graph-description">Arrows run from dependency to consumer. Direct dependencies are grouped in alphabetical Public and Private columns. Solid edges are public; dashed edges are private. Each access group shares one incoming arrow. Consumers, when present, appear directly below the selected module without repeated headings.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#8c8c8c"/></marker>
<mask id="node-core" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="438" style="mask-type:luminance"><rect width="576" height="438" fill="white"/>
<circle cx="252" cy="110" r="8" fill="black"/>
</mask>
<mask id="node-editor" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="438" style="mask-type:luminance"><rect width="576" height="438" fill="white"/>
</mask>
<mask id="node-engine" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="438" style="mask-type:luminance"><rect width="576" height="438" fill="white"/>
</mask>
<mask id="node-renderer" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="438" style="mask-type:luminance"><rect width="576" height="438" fill="white"/>
</mask>
<mask id="node-rhi" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="438" style="mask-type:luminance"><rect width="576" height="438" fill="white"/>
<circle cx="296" cy="210" r="8" fill="black"/>
<circle cx="280" cy="210" r="8" fill="black"/>
</mask>
<mask id="node-thirdparty::nvrhi" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="438" style="mask-type:luminance"><rect width="576" height="438" fill="white"/>
<circle cx="324" cy="110" r="8" fill="black"/>
</mask>
</defs>
<path data-dependency="core" data-consumer="rhi" d="M252,110 L280,138" fill="none" stroke="#8c8c8c" stroke-width="2.5"/>
<path data-dependency="thirdparty::nvrhi" data-consumer="rhi" d="M324,110 L296,138" fill="none" stroke="#8c8c8c" stroke-width="2.5" stroke-dasharray="7 5"/>
<path data-dependency="rhi" data-consumer="renderer" d="M280,210 L280,274 L272,282 L265.5,282" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-dependency="rhi" data-consumer="editor" d="M296,210 L296,274 L304,282 L310.5,282" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path data-dependency="rhi" data-consumer="engine" d="M296,210 L296,350 L304,358 L310.5,358" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path data-trunk="public" data-consumer="rhi" d="M280,138 L280,148.5" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-trunk="private" data-consumer="rhi" d="M296,138 L296,148.5" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="144" y="30" text-anchor="middle" fill="#c8c8c8" font-family="Futura Bk BT, sans-serif" font-size="19">Public</text>
<text x="432" y="30" text-anchor="middle" fill="#c8c8c8" font-family="Futura Bk BT, sans-serif" font-size="19">Private</text>
<a href="../../handbook/engine/rhi.html" target="_top">
<rect x="176" y="158" width="224" height="56" rx="15" fill="#171717" stroke="#009dff" stroke-width="3" mask="url(#node-rhi)"/>
<text x="288" y="192" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">rhi</text>
</a>
<a href="../../handbook/engine/core.html" target="_top">
<rect x="32" y="62" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-core)"/>
<text x="144" y="96" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">core</text>
</a>
<rect x="320" y="62" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-thirdparty::nvrhi)"/>
<text x="432" y="96" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">nvrhi</text>
<a href="../../handbook/engine/renderer.html" target="_top">
<rect x="32" y="254" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-renderer)"/>
<text x="144" y="288" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">renderer</text>
</a>
<a href="../../handbook/editor/editor.html" target="_top">
<rect x="320" y="254" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-editor)"/>
<text x="432" y="288" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">editor</text>
</a>
<a href="../../handbook/engine/engine.html" target="_top">
<rect x="320" y="330" width="224" height="56" rx="15" fill="#171717" stroke="#171717" stroke-width="3" mask="url(#node-engine)"/>
<text x="432" y="364" text-anchor="middle" fill="#ffffff" font-family="Futura Bk BT, sans-serif" font-size="19">engine</text>
</a>
<circle data-port="core" data-access="public" cx="252" cy="110" r="4" fill="#8c8c8c"/>
<circle data-port="rhi" data-access="private" cx="296" cy="210" r="4" fill="#8c8c8c"/>
<circle data-port="rhi" data-access="public" cx="280" cy="210" r="4" fill="#8c8c8c"/>
<circle data-port="thirdparty::nvrhi" data-access="private" cx="324" cy="110" r="4" fill="#8c8c8c"/>
</svg>
