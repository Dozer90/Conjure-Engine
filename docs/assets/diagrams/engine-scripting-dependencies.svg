<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 590" role="img"
 aria-labelledby="graph-title graph-description">
<title id="graph-title">Scripting module dependencies</title>
<desc id="graph-description">Arrows run from dependency to consumer. Direct dependencies are grouped in alphabetical Public and Private columns. Solid edges are public; dashed edges are private. Each access group shares one incoming arrow. Consumers, when present, appear directly below the selected module without repeated headings.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#8c8c8c"/></marker>
<mask id="node-assets" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
<circle cx="252" cy="110" r="8" fill="black"/>
</mask>
<mask id="node-bindings" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
</mask>
<mask id="node-core" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
<circle cx="252" cy="186" r="8" fill="black"/>
</mask>
<mask id="node-ecs" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
<circle cx="252" cy="262" r="8" fill="black"/>
</mask>
<mask id="node-editor" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
</mask>
<mask id="node-engine" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
</mask>
<mask id="node-scripting" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
<circle cx="296" cy="362" r="8" fill="black"/>
<circle cx="280" cy="362" r="8" fill="black"/>
</mask>
<mask id="node-thirdparty::nethost" maskUnits="userSpaceOnUse" x="0" y="0" width="576" height="590" style="mask-type:luminance"><rect width="576" height="590" fill="white"/>
<circle cx="324" cy="262" r="8" fill="black"/>
</mask>
</defs>
<path data-dependency="assets" data-consumer="scripting" d="M252,110 L280,138" fill="none" stroke="#8c8c8c" stroke-width="2.5"/>
<path data-dependency="core" data-consumer="scripting" d="M252,186 L280,214" fill="none" stroke="#8c8c8c" stroke-width="2.5"/>
<path data-dependency="ecs" data-consumer="scripting" d="M252,262 L280,290" fill="none" stroke="#8c8c8c" stroke-width="2.5"/>
<path data-dependency="thirdparty::nethost" data-consumer="scripting" d="M324,262 L296,290" fill="none" stroke="#8c8c8c" stroke-width="2.5" stroke-dasharray="7 5"/>
<path data-dependency="scripting" data-consumer="bindings" d="M280,362 L280,426 L272,434 L265.5,434" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-dependency="scripting" data-consumer="editor" d="M296,362 L296,426 L304,434 L310.5,434" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path data-dependency="scripting" data-consumer="engine" d="M296,362 L296,502 L304,510 L310.5,510" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path data-trunk="public" data-consumer="scripting" d="M280,138 L280,300.5" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-trunk="private" data-consumer="scripting" d="M296,290 L296,300.5" fill="none" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="144" y="30" text-anchor="middle" fill="#c8c8c8" font-family="Futura Bk BT, sans-serif" font-size="19">Public</text>
<text x="432" y="30" text-anchor="middle" fill="#c8c8c8" font-family="Futura Bk BT, sans-serif" font-size="19">Private</text>
