site_name: Conjure Engine
site_description: Public API wiki and engineering handbook for the Conjure game engine
repo_url: https://github.com/Dozer90/GameEngine_Claude-Assisted
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: false

hooks:
  - tools/docs_site.py

theme:
  name: material
  custom_dir: tools/docs_theme
  font: false
  logo: assets/brand/conjure-docs-logo.svg
  favicon: assets/brand/conjure-docs-favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: slate
      primary: custom
      accent: custom

extra_css:
  - assets/stylesheets/conjure-docs.css

extra_javascript:
  - assets/javascripts/conjure-docs.js
  - assets/javascripts/handbook-redirects.js

plugins:
  - search
  - gh-admonitions

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

# Publish the API and contributor handbook, without internal planning/review inputs.
exclude_docs: |
  CODE_STYLE.cpp
  ARCHITECTURE.md
  CONVENTIONS.md
  DESIGN_DOC.md
  design/
  reviews/

