site_name: Conjure Engine
site_description: Public API wiki and engineering handbook for the Conjure game engine
repo_url: https://github.com/Dozer90/GameEngine_Claude-Assisted
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

plugins:
  - search
  - gh-admonitions

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

# Pages not listed in nav are still built and reachable through links. docs/design/ is the design record:
# it is built so that the handbook's links into it resolve, but it stays out of the navigation and is
# reached from the handbook's chapters ("Decision records" in particular), never from the wiki.
exclude_docs: |
  CODE_STYLE.cpp

nav:
  - Home: index.md
  - Public API wiki:
      - api/index.md
      - Core:
          - Data types: api/core/data-types.md
          - Errors and results: api/core/errors-and-results.md
