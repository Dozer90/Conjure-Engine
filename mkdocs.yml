          - Math: api/core/math.md
          - Containers: api/core/containers.md
          - Strings and identifiers: api/core/strings-and-identifiers.md
          - Memory: api/core/memory.md
          - Time, events and random: api/core/time-and-events.md
          - Jobs and threading: api/core/jobs.md
          - JSON: api/core/json.md
          - Files and the virtual file system: api/core/files.md
          - Processes, libraries and images: api/core/system.md
          - Reflection: api/core/reflection.md
      - ECS:
